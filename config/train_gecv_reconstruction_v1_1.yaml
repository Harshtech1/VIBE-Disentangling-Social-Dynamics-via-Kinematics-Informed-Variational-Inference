# VIBE-GECV-RECON-v1.1 training configuration (CORRECTED ACTIVE BASELINE).
# V1.1 differs from the frozen v1.0 protocol only by the per-sample
# gamma/scene-scale broadcast correction in model/vibe_model.py.
protocol: VIBE-GECV-RECON-v1.1
seed: 20260928
data_root: "data/gecv_reconstruction_v1"
split_manifest: "data/manifests/gecv_reconstruction_v1_split_seed20260928.json"
log_dir: "logs/gecv_reconstruction_v1_1"
checkpoint_dir: "checkpoints/gecv_reconstruction_v1_1"

# Data/interface: HDF5 files remain unchanged; the Dataset adapter is explicit.
dataset_schema: gecv_reconstruction_v1
reconstruction_gamma_source: stored
reconstruction_mode: true
batch_size: 16          # Independent clips processed in each optimizer step.
num_workers: 0
max_k: 8                # Padded-agent capacity; masks mark which slots are real people.
max_t: 32               # Fixed temporal-bin interface for local/audio features.

# Existing VIBE topology with paper-target reconstruction hyperparameters.
input_dim: 768          # Stored DINOv2/HuBERT/global feature width.
latent_dim: 512         # Affective/environmental latent and temporal token width.
num_classes: 3          # Logit indices: Positive=0, Neutral=1, Negative=2.
attention_heads: 8      # Parallel attention projections.
transformer_depth: 2    # Gamma-gated temporal transformer blocks.
dropout: 0.3            # Training regularization, inactive during evaluation.
drop_path: 0.1          # Stochastic-depth probability in temporal residual blocks.

# Optimisation: 3-epoch linear warmup then epoch-indexed cosine annealing.
epochs: 30              # Complete schedule; validation does not trigger early stopping.
optimizer: adamw
lr: 1.0e-4              # AdamW base learning rate.
weight_decay: 1.0e-3    # AdamW regularization coefficient.
scheduler: warmup_cosine
warmup_epochs: 3        # Initial linear learning-rate warmup.
eta_min: 0.0
mixup_alpha: 0.2        # Beta parameter for latent manifold mixup.
grad_clip: 1.0          # Maximum gradient norm.

# Text is unavailable by approved reconstruction protocol: do not compute L_sat.
enable_sat: false       # No text anchors are available in this protocol.
lambda_sat: 0.0         # Keeps disabled semantic alignment at zero weight.
lambda_ortho: 0.1       # Encourages separated affect/environment latents.

# Checkpoint selection is validation-only; test is evaluated after selection.
best_metric: macro_f1   # Validation-only checkpoint selection criterion.
save_threshold: 0.60
enable_visualization: false
